{% extends "base.html" %}
{% block title %}Вход — {{ brand }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth">
  {% include "_auth_aside.html" %}
  <div class="brand">{% include "_brand.html" %}</div>
  <div class="card">
    <div>
      <h1 style="text-align:center;font-size:20px">Вход в кабинет</h1>
      <p class="sub" style="text-align:center;margin-top:6px">Введите выданные логин и пароль</p>
    </div>
    <form method="post" action="/login" style="display:flex;flex-direction:column;gap:14px">
      <label>Логин <input name="username" autocomplete="username" autofocus required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit" style="justify-content:center">Войти</button>
    </form>
  </div>
</div></div>
{% endblock %}
